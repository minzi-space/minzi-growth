<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>敏子的成长空间</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: white; border-radius: 20px; padding: 60px 40px;
    max-width: 500px; width: 90%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.1);
  }
  .card h1 { font-size: 2em; color: #333; margin-bottom: 10px; }
  .card .subtitle { color: #888; font-size: 1.1em; margin-bottom: 30px; }
  .card .emoji { font-size: 4em; margin-bottom: 20px; }
  .card .info { color: #666; line-height: 2; font-size: 1em; }
  .card a { color: #667eea; text-decoration: none; }
  .card a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="emoji">🌱</div>
  <h1>敏子的成长空间</h1>
  <p class="subtitle">记录学习、阅读与生活的点滴</p>
  <p class="info">
    这里是我的知识花园 🏡<br>
    每一篇笔记都是一颗种子<br>
    正在慢慢生根发芽……
  </p>
</div>
</body>
</html>
