<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>译林版英语互动Quiz · 五上~六下</title>
<style>
  :root {
    --primary: #1a6fb5; --primary-light: #e8f4fd;
    --correct: #43a047; --correct-light: #e8f5e9;
    --error: #e53935; --error-light: #ffebee;
    --warn: #ef6c00; --warn-light: #fff3e0;
    --bg: #f5f6f8; --card: #fff; --text: #2c3e50;
    --text-sec: #6b7d8e; --border: #e5e9f0;
    --shadow: 0 2px 8px rgba(0,0,0,0.06);
    --radius: 14px; --radius-sm: 10px;
    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: var(--font); background: var(--bg); color: var(--text);
    min-height: 100vh; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 0 0 32px; }

  /* Header */
  .header {
    background: linear-gradient(135deg, #1565c0, #1a6fb5, #2196F3);
    color: #fff; padding: 16px 16px 12px; text-align: center;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(26,111,181,0.2);
  }
  .header h1 { font-size: 18px; font-weight: 700; margin-bottom: 10px; letter-spacing: 0.5px; }
  .nav-tabs { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .nav-tab {
    padding: 7px 12px; border-radius: 20px; border: 1.5px solid rgba(255,255,255,0.4);
    background: transparent; color: rgba(255,255,255,0.85); font-size: 12.5px;
    font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: var(--font);
    position: relative;
  }
  .nav-tab.active { background: #fff; color: var(--primary); border-color: #fff; }
  .nav-tab:active { transform: scale(0.95); }
  .nav-tab .badge {
    position: absolute; top: -6px; right: -6px;
    background: var(--error); color: #fff; font-size: 10px;
    min-width: 18px; height: 18px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; line-height: 1;
  }

  /* Mode Selector */
  .mode-selector { display: flex; gap: 6px; justify-content: center; margin: 12px 16px; flex-wrap: wrap; }
  .mode-btn {
    padding: 7px 12px; border-radius: 16px; border: 1.5px solid var(--border);
    background: #fff; font-size: 12.5px; font-weight: 600; cursor: pointer;
    color: var(--text-sec); transition: all 0.2s; font-family: var(--font);
  }
  .mode-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .mode-btn:active { transform: scale(0.95); }

  /* Continuous mode toggle */
  .continuous-bar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin: 8px 16px; font-size: 13px; color: var(--text-sec);
  }
  .toggle-switch {
    width: 44px; height: 24px; background: #ccc; border-radius: 12px;
    position: relative; cursor: pointer; transition: background 0.3s;
  }
  .toggle-switch.on { background: var(--primary); }
  .toggle-switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 20px; height: 20px; background: #fff; border-radius: 50%;
    transition: transform 0.3s;
  }
  .toggle-switch.on::after { transform: translateX(20px); }

  /* Cards */
  .card {
    background: var(--card); border-radius: var(--radius); padding: 18px 16px;
    margin: 12px 12px; box-shadow: var(--shadow);
  }
  .card h3 { font-size: 15px; margin-bottom: 10px; color: var(--primary); }

  /* Progress */
  .progress-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .progress-bar { flex:1; height:6px; background:#e8edf2; border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg,var(--primary),#4fc3f7); border-radius:3px; transition:width 0.3s; }
  .progress-text { font-size:12px; color:var(--text-sec); font-weight:600; min-width:50px; text-align:right; white-space:nowrap; }

  /* Word display */
  .word-display { text-align:center; padding:22px 14px; margin:10px 0; background:#f8faff; border-radius:var(--radius-sm); border:1px dashed var(--border); }
  .word-display .big-word { font-size:28px; font-weight:700; color:var(--primary); letter-spacing:1px; }
  .word-display .big-zh { font-size:26px; font-weight:700; color:#333; }
  .word-display .hint { font-size:12px; color:var(--text-sec); margin-top:4px; }

  /* Options */
  .options-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
  .option-btn {
    padding:14px 10px; border-radius:var(--radius-sm); border:2px solid var(--border);
    background:#fff; font-size:15px; font-weight:600; cursor:pointer; transition:all 0.15s;
    font-family:var(--font); min-height:48px; display:flex; align-items:center;
    justify-content:center; text-align:center; color:var(--text);
  }
  .option-btn:active { transform:scale(0.96); }
  .option-btn.correct { background:var(--correct-light); border-color:var(--correct); color:var(--correct); animation:pulse 0.4s ease; }
  .option-btn.wrong { background:var(--error-light); border-color:var(--error); color:var(--error); animation:shake 0.4s ease; }
  .option-btn:disabled { pointer-events:none; opacity:0.9; }

  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  /* Input */
  .input-wrap { display:flex; gap:8px; margin:14px 0; }
  .input-wrap input {
    flex:1; padding:12px 14px; border:2px solid var(--border); border-radius:var(--radius-sm);
    font-size:18px; font-family:"SF Mono","Consolas","Courier New",monospace;
    outline:none; transition:border-color 0.2s; letter-spacing:1px;
  }
  .input-wrap input:focus { border-color:var(--primary); }
  .input-wrap input.correct-input { border-color:var(--correct); background:var(--correct-light); }
  .input-wrap input.wrong-input { border-color:var(--error); background:var(--error-light); }
  .submit-btn {
    padding:12px 20px; background:var(--primary); color:#fff; border:none;
    border-radius:var(--radius-sm); font-size:15px; font-weight:700; cursor:pointer;
    font-family:var(--font); min-width:64px;
  }
  .submit-btn:active { transform:scale(0.95); opacity:0.9; }
  .submit-btn:disabled { opacity:0.5; pointer-events:none; }

  /* Feedback */
  .feedback { text-align:center; padding:6px; font-size:13px; font-weight:600; min-height:26px; border-radius:6px; margin:6px 0; }
  .feedback.correct-fb { color:var(--correct); }
  .feedback.wrong-fb { color:var(--error); }

  /* Explanation box */
  .explanation-box {
    background: #fefcf5; border: 1px solid #f0e6c8; border-radius: 8px;
    padding: 10px 12px; margin: 8px 0; font-size: 12.5px;
    color: #6d5e00; line-height: 1.6;
  }
  .explanation-box .exp-label { font-weight:700; font-size:11px; color:#8d6e00; margin-bottom:2px; text-transform:uppercase; letter-spacing:0.5px; }

  /* Result */
  .result-card { text-align:center; padding:20px 14px; }
  .result-card .score { font-size:52px; font-weight:800; color:var(--primary); line-height:1; margin:6px 0; }
  .result-card .score-label { font-size:14px; color:var(--text-sec); margin-bottom:2px; }
  .result-card .encourage { font-size:15px; font-weight:600; margin:10px 0; padding:10px; border-radius:8px; }
  .result-card .time-info { font-size:13px; color:var(--text-sec); margin-bottom:4px; }
  .result-card .best-score { font-size:12px; color:var(--text-sec); margin-bottom:4px; background:var(--primary-light); display:inline-block; padding:4px 12px; border-radius:12px; }
  .result-card .round-info { font-size:13px; color:var(--text-sec); margin-bottom:8px; }
  .result-card .wrong-summary { font-size:12px; color:var(--error); margin-bottom:10px; }
  .restart-btn {
    padding:12px 28px; background:var(--primary); color:#fff; border:none; border-radius:24px;
    font-size:15px; font-weight:700; cursor:pointer; font-family:var(--font);
    box-shadow:0 2px 8px rgba(26,111,181,0.3); margin:4px;
  }
  .restart-btn:active { transform:scale(0.95); }
  .review-btn {
    padding:10px 24px; background:#fff; color:var(--warn); border:2px solid var(--warn);
    border-radius:24px; font-size:14px; font-weight:700; cursor:pointer; font-family:var(--font); margin:4px;
  }
  .review-btn:active { transform:scale(0.95); background:var(--warn-light); }

  /* Sentence */
  .sentence-display { font-size:15px; line-height:1.7; padding:12px 10px; background:#fafbfc; border-radius:var(--radius-sm); margin:10px 0; text-align:center; }
  .sentence-display .blank { display:inline-block; min-width:60px; border-bottom:2px solid var(--primary); margin:0 4px; color:var(--primary); font-weight:700; }

  /* Start */
  .start-screen { text-align:center; padding:32px 16px; }
  .start-screen .emoji { font-size:48px; margin-bottom:10px; }
  .start-screen h2 { font-size:19px; margin-bottom:6px; }
  .start-screen p { font-size:13px; color:var(--text-sec); margin-bottom:14px; line-height:1.6; }
  .start-btn {
    padding:14px 36px; background:linear-gradient(135deg,#1565c0,#2196F3); color:#fff;
    border:none; border-radius:28px; font-size:16px; font-weight:700; cursor:pointer;
    font-family:var(--font); box-shadow:0 4px 14px rgba(26,111,181,0.35); transition:all 0.2s;
  }
  .start-btn:active { transform:scale(0.95); box-shadow:0 2px 8px rgba(26,111,181,0.2); }

  /* Verb */
  .verb-display { text-align:center; padding:18px; background:#f8faff; border-radius:var(--radius-sm); margin:10px 0; }
  .verb-display .verb-en { font-size:30px; font-weight:700; color:var(--primary); }
  .verb-display .verb-zh { font-size:14px; color:var(--text-sec); margin-top:4px; }

  /* Wrong book list */
  .wrong-item {
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .wrong-item .wi-q { font-size:13px; color:var(--text); margin-bottom:4px; }
  .wrong-item .wi-wrong { font-size:12px; color:var(--error); }
  .wrong-item .wi-correct { font-size:12px; color:var(--correct); font-weight:600; }
  .wrong-item .wi-exp { font-size:11.5px; color:#8d6e00; margin-top:4px; padding:6px 8px; background:#fefcf5; border-radius:4px; }
  .wrong-item .wi-date { font-size:10px; color:var(--text-sec); margin-top:4px; }
  .wrong-item .wi-actions { margin-top:6px; display:flex; gap:6px; }
  .wrong-item .wi-actions button {
    font-size:11px; padding:4px 10px; border-radius:12px; border:1px solid var(--border);
    background:#fff; cursor:pointer; font-family:var(--font);
  }
  .wrong-item .wi-actions button:active { background:#f0f0f0; }

  .empty-state { text-align:center; padding:32px 16px; color:var(--text-sec); }
  .empty-state .emoji { font-size:40px; margin-bottom:8px; }
  .empty-state p { font-size:14px; }

  .hidden { display:none !important; }
  .stars { font-size:26px; margin:4px 0; letter-spacing:3px; }

  /* Clear btn */
  .clear-btn {
    display:block; margin:12px auto; padding:8px 20px; background:transparent;
    color:var(--text-sec); border:1px solid var(--border); border-radius:16px;
    font-size:12px; cursor:pointer; font-family:var(--font);
  }
  .clear-btn:active { background:#f0f0f0; }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <h1>📚 译林版英语Quiz</h1>
    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="vocab">📝 单词闪卡</button>
      <button class="nav-tab" data-tab="grammar">📐 语法闯关</button>
      <button class="nav-tab" data-tab="verb">🔄 不规则动词</button>
      <button class="nav-tab" data-tab="wrongbook" id="wrongbookTab">📒 错题本<span class="badge hidden" id="wrongbookBadge">0</span></button>
    </div>
  </div>

  <!-- VOCAB MODE SELECTOR -->
  <div class="mode-selector" id="vocabModeSelector">
    <button class="mode-btn active" data-vmode="en2zh">看英选中</button>
    <button class="mode-btn" data-vmode="zh2en">看中拼英</button>
    <button class="mode-btn" data-vmode="mixed">混合挑战</button>
  </div>

  <!-- Continuous mode toggle -->
  <div class="continuous-bar" id="continuousBar">
    <span>📡 连续挑战模式</span>
    <div class="toggle-switch" id="continuousToggle"></div>
  </div>

  <!-- ===== VOCAB SECTION ===== -->
  <div class="card" id="vocabSection">
    <div id="vocabStart" class="start-screen">
      <div class="emoji">📝</div>
      <h2>单词闪卡</h2>
      <p>译林版五上~六下核心词汇<br>三种难度，选一个开始吧！</p>
      <p style="font-size:12px;color:var(--text-sec);">🏆 最高分：<span id="vocabBest">--</span></p>
      <button class="start-btn" id="vocabStartBtn">开始挑战（10题）</button>
    </div>
    <div id="vocabQuiz" class="hidden">
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="vocabProgress" style="width:0%"></div></div>
        <div class="progress-text" id="vocabCount">1/10</div>
      </div>
      <div id="vocabQuestion"></div>
      <div class="feedback" id="vocabFeedback"></div>
      <div id="vocabExplanation"></div>
    </div>
    <div id="vocabResult" class="result-card hidden">
      <div class="score-label">你的得分</div>
      <div class="score" id="vocabScoreNum">0</div>
      <div class="stars" id="vocabStars"></div>
      <div class="time-info" id="vocabTime"></div>
      <div class="round-info" id="vocabRound"></div>
      <div class="wrong-summary" id="vocabWrongSummary"></div>
      <div class="best-score" id="vocabBestDisplay">🏆 最高分：--</div>
      <div class="encourage" id="vocabEncourage"></div>
      <button class="restart-btn" id="vocabNextRound" style="display:none;">▶ 下一轮</button>
      <button class="review-btn" id="vocabReviewWrong" style="display:none;">📒 复习本轮错题</button>
      <button class="restart-btn" id="vocabRestart">重新开始</button>
    </div>
  </div>

  <!-- ===== GRAMMAR SECTION ===== -->
  <div class="card hidden" id="grammarSection">
    <div id="grammarStart" class="start-screen">
      <div class="emoji">📐</div>
      <h2>语法闯关</h2>
      <p>一般现在时 · 现在进行时 · 一般过去时<br>选择正确的动词形式</p>
      <p style="font-size:12px;color:var(--text-sec);">🏆 最高分：<span id="grammarBest">--</span></p>
      <button class="start-btn" id="grammarStartBtn">开始挑战（10题）</button>
    </div>
    <div id="grammarQuiz" class="hidden">
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="grammarProgress" style="width:0%"></div></div>
        <div class="progress-text" id="grammarCount">1/10</div>
      </div>
      <div id="grammarQuestion"></div>
      <div class="feedback" id="grammarFeedback"></div>
      <div id="grammarExplanation"></div>
    </div>
    <div id="grammarResult" class="result-card hidden">
      <div class="score-label">你的得分</div>
      <div class="score" id="grammarScoreNum">0</div>
      <div class="stars" id="grammarStars"></div>
      <div class="round-info" id="grammarRound"></div>
      <div class="wrong-summary" id="grammarWrongSummary"></div>
      <div class="best-score" id="grammarBestDisplay">🏆 最高分：--</div>
      <div class="encourage" id="grammarEncourage"></div>
      <button class="restart-btn" id="grammarNextRound" style="display:none;">▶ 下一轮</button>
      <button class="review-btn" id="grammarReviewWrong" style="display:none;">📒 复习本轮错题</button>
      <button class="restart-btn" id="grammarRestart">重新开始</button>
    </div>
  </div>

  <!-- ===== VERB SECTION ===== -->
  <div class="card hidden" id="verbSection">
    <div id="verbStart" class="start-screen">
      <div class="emoji">🔄</div>
      <h2>不规则动词</h2>
      <p>译林版必考40个不规则动词<br>看原形，拼过去式</p>
      <p style="font-size:12px;color:var(--text-sec);">🏆 最高分：<span id="verbBest">--</span></p>
      <button class="start-btn" id="verbStartBtn">开始挑战（10题）</button>
    </div>
    <div id="verbQuiz" class="hidden">
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="verbProgress" style="width:0%"></div></div>
        <div class="progress-text" id="verbCount">1/10</div>
      </div>
      <div id="verbQuestion"></div>
      <div class="feedback" id="verbFeedback"></div>
      <div id="verbExplanation"></div>
    </div>
    <div id="verbResult" class="result-card hidden">
      <div class="score-label">你的得分</div>
      <div class="score" id="verbScoreNum">0</div>
      <div class="stars" id="verbStars"></div>
      <div class="round-info" id="verbRound"></div>
      <div class="wrong-summary" id="verbWrongSummary"></div>
      <div class="best-score" id="verbBestDisplay">🏆 最高分：--</div>
      <div class="encourage" id="verbEncourage"></div>
      <button class="restart-btn" id="verbNextRound" style="display:none;">▶ 下一轮</button>
      <button class="review-btn" id="verbReviewWrong" style="display:none;">📒 复习本轮错题</button>
      <button class="restart-btn" id="verbRestart">重新开始</button>
    </div>
  </div>

  <!-- ===== WRONG BOOK SECTION ===== -->
  <div class="card hidden" id="wrongbookSection">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h3 style="margin:0;">📒 错题本</h3>
      <button class="clear-btn" id="clearWrongbook">清空错题本</button>
    </div>
    <div id="wrongbookTabs" style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;">
      <button class="mode-btn active" data-wtab="all">全部</button>
      <button class="mode-btn" data-wtab="vocab">单词</button>
      <button class="mode-btn" data-wtab="grammar">语法</button>
      <button class="mode-btn" data-wtab="verb">动词</button>
    </div>
    <div id="wrongbookList"></div>
    <div class="empty-state" id="wrongbookEmpty">
      <div class="emoji">🎉</div>
      <p>还没有错题，太棒了！<br>继续练习，错题会自动收集到这里。</p>
    </div>
  </div>

</div>

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setBest(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }

// ==================== WRONG BOOK STORAGE ====================
function getWrongBook() {
  try { return JSON.parse(localStorage.getItem('wrongbook') || '[]'); } catch(e) { return []; }
}
function saveWrongBook(book) {
  try { localStorage.setItem('wrongbook', JSON.stringify(book)); } catch(e) {}
}
function addWrongItem(item) {
  const book = getWrongBook();
  // Don't add duplicates for the same question
  const dup = book.find(b => b.type === item.type && b.question === item.question && b.userAnswer === item.userAnswer);
  if (!dup) {
    book.unshift({ ...item, date: new Date().toLocaleString('zh-CN') });
    if (book.length > 200) book.length = 200; // limit
    saveWrongBook(book);
  }
  updateWrongbookBadge();
}
function removeWrongItem(index) {
  const book = getWrongBook();
  book.splice(index, 1);
  saveWrongBook(book);
  updateWrongbookBadge();
}
function clearWrongBook() {
  if (confirm('确定要清空所有错题吗？这个操作不可撤销。')) {
    saveWrongBook([]);
    updateWrongbookBadge();
    renderWrongBook();
  }
}
function updateWrongbookBadge() {
  const count = getWrongBook().length;
  const badge = document.getElementById('wrongbookBadge');
  if (count > 0) {
    badge.textContent = count > 99 ? '99+' : count;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

function getEncourage(score, total) {
  const pct = score / total;
  if (pct === 1) return "🎉 完美！你是英语小天才！";
  if (pct >= 0.9) return "🌟 太棒了！继续保持！";
  if (pct >= 0.7) return "👍 很不错，再加把劲！";
  if (pct >= 0.5) return "💪 还可以，继续练习会更好！";
  if (pct >= 0.3) return "📖 别灰心，多练几次就好了！";
  return "🌱 每一次错误都是成长，加油！";
}

function getStars(score, total) {
  const pct = score / total;
  if (pct >= 1) return "⭐⭐⭐⭐⭐";
  if (pct >= 0.8) return "⭐⭐⭐⭐";
  if (pct >= 0.6) return "⭐⭐⭐";
  if (pct >= 0.4) return "⭐⭐";
  return "⭐";
}

// ==================== VOCAB QUIZ ====================
let vocabState = { mode: 'en2zh', questions: [], current: 0, score: 0, startTime: 0, answered: false, round: 1, roundWrong: [] };

function initVocab() {
  const mode = vocabState.mode;
  const pool = shuffle(vocabData).slice(0, 10);
  if (mode === 'mixed') {
    vocabState.questions = pool.map((item, i) => ({ type: i % 2 === 0 ? 'en2zh' : 'zh2en', data: item }));
  } else {
    vocabState.questions = pool.map(item => ({ type: mode, data: item }));
  }
  vocabState.current = 0;
  vocabState.score = 0;
  vocabState.startTime = Date.now();
  vocabState.answered = false;
  vocabState.roundWrong = [];
}

function renderVocabQuestion() {
  const q = vocabState.questions[vocabState.current];
  const container = document.getElementById('vocabQuestion');
  const fb = document.getElementById('vocabFeedback');
  const exp = document.getElementById('vocabExplanation');
  fb.textContent = '';
  fb.className = 'feedback';
  exp.innerHTML = '';
  vocabState.answered = false;

  if (q.type === 'en2zh') {
    const correct = q.data.zh;
    const others = shuffle(vocabData.filter(v => v.zh !== correct)).slice(0, 3).map(v => v.zh);
    const options = shuffle([correct, ...others]);
    container.innerHTML = `
      <div class="word-display">
        <div class="big-word">${q.data.en}</div>
        <div class="hint">选择正确的中文意思</div>
      </div>
      <div class="options-grid">
        ${options.map(opt => `<button class="option-btn" data-answer="${opt}">${opt}</button>`).join('')}
      </div>`;
    container.querySelectorAll('.option-btn').forEach(btn => {
      btn.addEventListener('click', () => handleVocabChoice(btn));
    });
  } else {
    container.innerHTML = `
      <div class="word-display">
        <div class="big-zh">${q.data.zh}</div>
        <div class="hint">请输入对应的英文单词</div>
      </div>
      <div class="input-wrap">
        <input type="text" id="vocabInput" placeholder="输入英文..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="submit-btn" id="vocabSubmit">提交</button>
      </div>`;
    const input = document.getElementById('vocabInput');
    const submit = document.getElementById('vocabSubmit');
    submit.addEventListener('click', () => handleVocabInput(input));
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleVocabInput(input); });
    setTimeout(() => input.focus(), 100);
  }

  document.getElementById('vocabCount').textContent = `${vocabState.current + 1}/10`;
  document.getElementById('vocabProgress').style.width = `${(vocabState.current / 10) * 100}%`;
}

function handleVocabChoice(btn) {
  if (vocabState.answered) return;
  vocabState.answered = true;
  const q = vocabState.questions[vocabState.current];
  const fb = document.getElementById('vocabFeedback');
  const exp = document.getElementById('vocabExplanation');
  const allBtns = btn.parentElement.querySelectorAll('.option-btn');
  const isCorrect = btn.dataset.answer === q.data.zh;

  if (isCorrect) {
    btn.classList.add('correct');
    fb.textContent = '✅ 正确！';
    fb.className = 'feedback correct-fb';
    vocabState.score++;
  } else {
    btn.classList.add('wrong');
    fb.textContent = `❌ 错了！正确答案是「${q.data.zh}」`;
    fb.className = 'feedback wrong-fb';
    allBtns.forEach(b => { if (b.dataset.answer === q.data.zh) b.classList.add('correct'); });
    // Explanation
    exp.innerHTML = `<div class="explanation-box"><div class="exp-label">💡 解析</div>${q.data.en} = ${q.data.zh}（${q.data.unit || ''}）。记住这个搭配，下次就不会错了！</div>`;
    // Add to wrong book
    const wrongItem = {
      type: 'vocab',
      question: `"${q.data.en}" 的中文意思？`,
      userAnswer: btn.dataset.answer,
      correctAnswer: q.data.zh,
      explanation: `${q.data.en} = ${q.data.zh}（${q.data.unit || ''}）。记住这个单词的中文意思。`
    };
    addWrongItem(wrongItem);
    vocabState.roundWrong.push(wrongItem);
  }
  allBtns.forEach(b => b.disabled = true);
  setTimeout(nextVocabQuestion, 1800);
}

function handleVocabInput(input) {
  if (vocabState.answered) return;
  const userAnswer = input.value.trim().toLowerCase();
  if (!userAnswer) return;
  vocabState.answered = true;
  const q = vocabState.questions[vocabState.current];
  const correctAnswer = q.data.en.toLowerCase();
  const fb = document.getElementById('vocabFeedback');
  const exp = document.getElementById('vocabExplanation');
  const submitBtn = document.getElementById('vocabSubmit');
  const isCorrect = userAnswer === correctAnswer;

  if (isCorrect) {
    input.classList.add('correct-input');
    fb.textContent = '✅ 正确！';
    fb.className = 'feedback correct-fb';
    vocabState.score++;
  } else {
    input.classList.add('wrong-input');
    fb.textContent = `❌ 错了！正确答案是「${q.data.en}」`;
    fb.className = 'feedback wrong-fb';
    exp.innerHTML = `<div class="explanation-box"><div class="exp-label">💡 解析</div>「${q.data.zh}」的英文是 <strong>${q.data.en}</strong>（${q.data.unit || ''}）。注意拼写，多写几遍加深记忆！</div>`;
    const wrongItem = {
      type: 'vocab',
      question: `"${q.data.zh}" 的英文拼写？`,
      userAnswer: userAnswer,
      correctAnswer: q.data.en,
      explanation: `「${q.data.zh}」的英文是 ${q.data.en}（${q.data.unit || ''}）。建议手写3遍加深记忆。`
    };
    addWrongItem(wrongItem);
    vocabState.roundWrong.push(wrongItem);
  }
  input.disabled = true;
  if (submitBtn) submitBtn.disabled = true;
  setTimeout(nextVocabQuestion, 2000);
}

function nextVocabQuestion() {
  vocabState.current++;
  if (vocabState.current >= 10) {
    showVocabResult();
  } else {
    renderVocabQuestion();
  }
}

function showVocabResult() {
  const elapsed = Math.floor((Date.now() - vocabState.startTime) / 1000);
  const score = vocabState.score;
  const best = getBest('vocabBest');
  const newBest = score > best ? score : best;
  if (score > best) setBest('vocabBest', score);

  document.getElementById('vocabQuiz').classList.add('hidden');
  document.getElementById('vocabResult').classList.remove('hidden');
  document.getElementById('vocabScoreNum').textContent = `${score}/10`;
  document.getElementById('vocabStars').textContent = getStars(score, 10);
  document.getElementById('vocabTime').textContent = `用时 ${elapsed} 秒`;
  document.getElementById('vocabRound').textContent = `第 ${vocabState.round} 轮`;
  document.getElementById('vocabBestDisplay').textContent = `🏆 最高分：${newBest}/10`;
  document.getElementById('vocabEncourage').textContent = getEncourage(score, 10);
  document.getElementById('vocabEncourage').style.background = score >= 7 ? 'var(--correct-light)' : 'var(--primary-light)';
  document.getElementById('vocabBest').textContent = `${newBest}/10`;

  const wrongCount = vocabState.roundWrong.length;
  const nextBtn = document.getElementById('vocabNextRound');
  const reviewBtn = document.getElementById('vocabReviewWrong');

  if (wrongCount > 0) {
    document.getElementById('vocabWrongSummary').textContent = `📌 本轮错了 ${wrongCount} 题，已加入错题本`;
    reviewBtn.style.display = 'inline-block';
    reviewBtn.onclick = () => { switchTab('wrongbook'); document.querySelector('[data-wtab="vocab"]').click(); };
  } else {
    document.getElementById('vocabWrongSummary').textContent = '';
    reviewBtn.style.display = 'none';
  }

  if (continuousMode) {
    nextBtn.style.display = 'inline-block';
    nextBtn.onclick = () => {
      vocabState.round++;
      document.getElementById('vocabResult').classList.add('hidden');
      document.getElementById('vocabQuiz').classList.remove('hidden');

let wrongbookFilter = 'all';

function renderWrongBook() {
  const book = getWrongBook();
  const list = document.getElementById('wrongbookList');
  const empty = document.getElementById('wrongbookEmpty');

  let filtered = book;
  if (wrongbookFilter !== 'all') {
    filtered = book.filter(item => item.type === wrongbookFilter);
  }

  if (filtered.length === 0) {
    list.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }

  empty.classList.add('hidden');
  list.innerHTML = filtered.map((item, i) => {
    const typeLabel = item.type === 'vocab' ? '📝 单词' : item.type === 'grammar' ? '📐 语法' : '🔄 动词';
    return `
      <div class="wrong-item">

        <div class="wi-wrong">❌ 你的答案：${item.userAnswer}</div>
        <div class="wi-correct">✅ 正确答案：${item.correctAnswer}</div>
        <div class="wi-exp">${item.explanation || ''}</div>
        <div class="wi-date">${item.date || ''}</div>
        <div class="wi-actions">
          <button onclick="removeWrongItem(${i}); renderWrongBook();">🗑 已掌握，删除</button>
        </div>
      </div>`;
  }).join('');

  currentTab = tab;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

  document.getElementById('vocabSection').classList.toggle('hidden', tab !== 'vocab');
  document.getElementById('grammarSection').classList.toggle('hidden', tab !== 'grammar');
  document.getElementById('verbSection').classList.toggle('hidden', tab !== 'verb');
  document.getElementById('wrongbookSection').classList.toggle('hidden', tab !== 'wrongbook');
  document.getElementById('vocabModeSelector').classList.toggle('hidden', tab !== 'vocab');
  document.getElementById('continuousBar').classList.toggle('hidden', tab === 'wrongbook');

  if (tab === 'wrongbook') {
    renderWrongBook();
  }

  // Reset views
  if (tab === 'vocab') {
    document.getElementById('vocabStart').classList.remove('hidden');
    document.getElementById('vocabQuiz').classList.add('hidden');
    document.getElementById('vocabResult').classList.add('hidden');
  } else if (tab === 'grammar') {
    document.getElementById('grammarStart').classList.remove('hidden');
    document.getElementById('grammarQuiz').classList.add('hidden');
    document.getElementById('grammarResult').classList.add('hidden');
  } else if (tab === 'verb') {
    document.getElementById('verbStart').classList.remove('hidden');
    document.getElementById('verbQuiz').classList.add('hidden');
    document.getElementById('verbResult').classList.add('hidden');
  }
}

// ==================== EVENT BINDINGS ====================
document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => switchTab(tab.dataset.tab));
});

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    if (this.dataset.vmode) {
      document.querySelectorAll('#vocabModeSelector .mode-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      vocabState.mode = this.dataset.vmode;
      document.getElementById('vocabStart').classList.remove('hidden');
      document.getElementById('vocabQuiz').classList.add('hidden');
      document.getElementById('vocabResult').classList.add('hidden');
    } else if (this.dataset.wtab) {
      document.querySelectorAll('#wrongbookTabs .mode-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      wrongbookFilter = this.dataset.wtab;
      renderWrongBook();
    }
  });
});

document.getElementById('vocabStartBtn').addEventListener('click', startVocab);
document.getElementById('vocabRestart').addEventListener('click', () => {
  document.getElementById('vocabResult').classList.add('hidden');
  document.getElementById('vocabStart').classList.remove('hidden');
});

document.getElementById('grammarStartBtn').addEventListener('click', startGrammar);
document.getElementById('grammarRestart').addEventListener('click', () => {
  document.getElementById('grammarResult').classList.add('hidden');
  document.getElementById('grammarStart').classList.remove('hidden');
});

document.getElementById('verbStartBtn').addEventListener('click', startVerb);
document.getElementById('verbRestart').addEventListener('click', () => {
  document.getElementById('verbResult').classList.add('hidden');
  document.getElementById('verbStart').classList.remove('hidden');
});

document.getElementById('clearWrongbook').addEventListener('click', clearWrongBook);

// ==================== INIT ====================
document.getElementById('vocabBest').textContent = `${getBest('vocabBest')}/10`;
document.getElementById('grammarBest').textContent = `${getBest('grammarBest')}/10`;
document.getElementById('verbBest').textContent = `${getBest('verbBest')}/10`;
updateWrongbookBadge();
</script>
</body>
</html>
